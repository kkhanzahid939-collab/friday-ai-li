<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIDAY AI</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #101116;
      color: white;
      font-family: Arial, sans-serif;
    }
    h1 { color: #65d5ff; font-weight: 400; }
    p { color: #bfc3ce; }
    #chat {
      margin-top: 35px;
      padding: 20px;
      background: #262936;
      border-radius: 18px;
      line-height: 1.6;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #262936;
      color: white;
      font-size: 16px;
    }
    button {
      margin-top: 12px;
      padding: 14px 25px;
      border: 0;
      border-radius: 25px;
      background: #cbbdf5;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>FRIDAY AI</h1>
  <p>Your personal assistant</p>

  <div id="chat">
    Friday: Hello! Main Friday hoon.
    Abhi mera AI connection set karna baaki hai.
  </div>

  <input id="message" placeholder="Friday se baat karo...">
  <button onclick="sendMessage()">Send</button>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const message = input.value.trim();

      if (!message) return;

      chat.innerHTML += "<p><b>You:</b> " +
        message.replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;") + "</p>";

      chat.innerHTML += "<p><b>Friday:</b> Abhi mera AI connection set karna baaki hai.</p>";
      input.value = "";
    }
  </script>
</body>
</html>
